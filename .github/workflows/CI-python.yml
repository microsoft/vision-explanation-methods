name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron:  '30 5 * * *'

jobs:
  ci-numpy-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - numpyVersion: '1.23.5'
            matplotlibSpec: 'matplotlib==3.9.0'
            captumSpec: 'captum==0.5.0'
          - numpyVersion: '1.26.4'
            matplotlibSpec: 'matplotlib==3.9.0'
          - numpyVersion: '2.0.2'
            matplotlibSpec: 'matplotlib==3.9.0'
          - numpyVersion: '2.2.6'
            matplotlibSpec: 'matplotlib'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package with NumPy ${{ matrix.numpyVersion }}
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install "numpy==${{ matrix.numpyVersion }}" "${{ matrix.matplotlibSpec }}" "${{ matrix.captumSpec || 'captum' }}" -e ./python pytest requests

    - name: Verify dependency consistency
      run: |
        python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpyVersion }}'"
        pip check

    - name: Run NumPy compatibility test
      run: |
        python -m compileall -q python/vision_explanation_methods
        pytest numpy_compatibility_tests -v

  ci-python:
    strategy:
      fail-fast: false
      matrix:
        packageDirectory: ["vision_explanation_methods"]
        # disabling macos-latest for now as tests are failing
        operatingSystem: [ubuntu-latest, windows-latest]
        # skip python 3.9 as model seems to fail to detect in tests
        pythonVersion: ['3.7', '3.8']

    runs-on: ${{ matrix.operatingSystem }}

    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.pythonVersion }}
    - name: Install compatible legacy PyTorch and Captum
      shell: bash -l {0}
      run: |
        set -e
        python -m pip install "torch==1.13.1+cpu" "torchvision==0.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
        python -m pip install "captum==0.6.0"
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e ./python
    - name: Install test dependencies
      shell: bash -l {0}
      run: |
        pip install -r requirements-test.txt
    - name: Test with pytest
      shell: bash -l {0}
      run: |
        set -e
        python -m pip check
        pytest ./tests numpy_compatibility_tests -s -v --durations=10 --cov='vision_explanation_methods' --cov-report=xml --cov-report=html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.packageDirectory }}-${{ matrix.operatingSystem }}-py${{ matrix.pythonVersion }}-code-coverage-results
        path: htmlcov
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
    - if: ${{ (matrix.operatingSystem == 'windows-latest') && (matrix.pythonVersion == '3.8') }}
      name: Upload to codecov
      id: codecovupload1
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        verbose: true
    - if: ${{ (steps.codecovupload1.outcome == 'failure') && (matrix.pythonVersion == '3.8') && (matrix.operatingSystem == 'windows-latest') }}
      name: Retry upload to codecov
      id: codecovupload2
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        verbose: true
    - name: Set codecov status
      if: ${{ (matrix.pythonVersion == '3.8') && (matrix.operatingSystem == 'windows-latest') }}
      shell: bash
      run: |
        if ${{ (steps.codecovupload1.outcome == 'success') || (steps.codecovupload2.outcome == 'success') }} ; then
          echo fine
        else
          exit 1
        fi
